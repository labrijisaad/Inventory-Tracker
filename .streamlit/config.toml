[theme]
primaryColor = "#3b82f6"
backgroundColor = "#1e1e1e"
secondaryBackgroundColor = "#2d2d2d"
textColor = "#e5e7eb"
font = "sans serif"

[server]
# Port
port = 8501

# Address: localhost for dev, 0.0.0.0 for production (VM)
# Will be overridden by command-line flag in production
address = "localhost"

# Headless mode (don't auto-open browser)
headless = true

# CORS & Security (fixed conflict)
enableCORS = true
enableXsrfProtection = true

# Max upload size
maxUploadSize = 200

[browser]
# Don't collect usage stats
gatherUsageStats = false

# Server address for browser
serverAddress = "localhost"
serverPort = 8501

[client]
showSidebarNavigation = true
showErrorDetails = true
toolbarMode = "minimal"

[runner]
fastReruns = true
magicEnabled = true

[logger]
level = "INFO"