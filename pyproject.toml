[project]
name = "midad-books-manager"
version = "1.0.0"
description = "Comprehensive bookshop management system for Midad Books - Arabic literature business"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "sqlmodel>=0.0.31",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W"]
ignore = ["E501"]  # Line too long (handled by black)
